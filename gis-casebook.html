\n\n  --color-accent-2-100: #fff3e4;\n  --color-accent-2-200: #ffe3be;\n  --color-accent-2-300: #f5cd96;\n  --color-accent-2-400: #dbaf70;\n  --color-accent-2-500: #bc8f4e;\n  --color-accent-2-600: #9b7232;\n  --color-accent-2-700: #79561f;\n  --color-accent-2-800: #573d14;\n  --color-accent-2-900: #382810;\n\n  --font-heading: \"Cormorant Garamond\", system-ui, sans-serif;\n  --font-heading-weight: 600; /* review round 3: bold retired — semibold is the\n     interface headings' ceiling (they need the weight at small sizes); display\n     text goes lighter still, to the normal cut (see the deck) */\n  --font-body: \"Lora\", system-ui, sans-serif;\n\n  --space-1: 4.6px;\n  --space-2: 9.2px;\n  --space-3: 13.8px;\n  --space-4: 18.4px;\n  --space-6: 27.6px;\n  --space-8: 36.8px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.plate{filter:sepia(0.22) saturate(0.82) contrast(1.05);box-sizing:border-box;\n  border:6px solid var(--color-surface);outline:1px solid var(--color-divider)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: transparent;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: transparent; border: 1px solid var(--color-divider);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 1px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg); border: 1px solid var(--color-divider);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"51718520-822a-46f1-b940-5fedbb003fcb\"><\u002Fscript>\n<script src=\"ed9730e6-12e6-4848-857e-667f7c1501af\"><\u002Fscript>\n<style>\n  body { margin: 0; background: var(--color-bg); }\n  a { color: var(--color-accent-700); text-decoration-thickness: 1px; text-underline-offset: 3px; }\n  a:hover { color: var(--color-accent-900); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)\">\n\n  \n\n  <header style=\"border-bottom:1px solid var(--color-divider);position:sticky;top:0;background:var(--color-bg);z-index:10\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:var(--space-4) var(--space-6);display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-6)\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goProfile }}\" style=\"font-family:var(--font-heading);font-size:22px;letter-spacing:.02em;text-decoration:none;color:var(--color-text)\">GIS Casebook<\u002Fa>\n      <nav style=\"display:flex;gap:calc(var(--space-4) + var(--space-1));font-size:14px\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goProfile }}\" style=\"text-decoration:none;color:var(--color-text);opacity:.75\">作者について<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goList }}\" style=\"text-decoration:none;color:var(--color-text);opacity:.75\">事例一覧<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goAbout }}\" style=\"text-decoration:none;color:var(--color-text);opacity:.75\">手法について<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isList }}\" hint-placeholder-val=\"{{ true }}\">\n    <main style=\"max-width:1180px;margin:0 auto;padding:var(--space-8) var(--space-6) calc(var(--space-8) + var(--space-6))\">\n\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-8);align-items:end;padding-bottom:var(--space-6)\">\n        <div>\n          <p style=\"font-family:var(--font-body);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-feature-settings:'tnum';color:var(--color-accent-700);margin:0 0 var(--space-3)\">空間データ分析の事例集<\u002Fp>\n          <h1 style=\"font-family:var(--font-heading);font-weight:400;font-size:52px;line-height:1.1;margin:0\">みどりと都市を<br>地図で読み解く<\u002Fh1>\n        <\u002Fdiv>\n        <p style=\"text-align:justify;font-size:15px;line-height:1.8;margin:0;color:var(--color-neutral-700);text-wrap:pretty\">衛星データ・公開統計・GISを用いて、緑地のつながり、森林の減少、開発の圧力、災害リスクといったテーマを地図に起こした事例をまとめています。各カードから、実際に操作できるマップを開くことができます。<\u002Fp>\n      <\u002Fdiv>\n\n      <hr class=\"hr\" style=\"margin:0 0 var(--space-6)\">\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;padding-bottom:calc(var(--space-6) + var(--space-2))\">\n        <span style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-right:var(--space-3)\">テーマ<\u002Fspan>\n        <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ t.select }}\" style=\"{{ t.style }}\" style-hover=\"border-color:var(--color-accent);color:var(--color-accent-800)\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:var(--space-6)\">\n        <sc-for list=\"{{ visible }}\" as=\"c\" hint-placeholder-count=\"9\">\n          <article class=\"card\" style=\"padding:0;overflow:hidden;display:flex;flex-direction:column;background:transparent\">\n            <div style=\"padding:calc(var(--space-4) + var(--space-1));display:flex;flex-direction:column;gap:var(--space-3);flex:1\">\n              <span class=\"tag tag-outline\" style=\"align-self:flex-start;font-size:11px;letter-spacing:.1em\">{{ c.theme }}<\u002Fspan>\n              <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:22px;line-height:1.25;margin:0\">{{ c.title }}<\u002Fh2>\n              <p style=\"font-size:14px;line-height:1.7;color:var(--color-neutral-700);margin:0;flex:1;text-wrap:pretty\">{{ c.lead }}<\u002Fp>\n              <div style=\"display:flex;gap:var(--space-3);align-items:center;padding-top:var(--space-2);border-top:1px solid var(--color-divider);margin-top:var(--space-1)\">\n                <a href=\"{{ c.url }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\" style=\"font-size:13px;padding:6px 14px;text-decoration:none\">マップを開く<\u002Fa>\n                <button sc-camel-on-click=\"{{ c.open }}\" class=\"btn btn-ghost\" style=\"font-size:13px;padding:6px 10px\">詳細<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <section style=\"margin-top:calc(var(--space-8) + var(--space-6))\">\n        <hr class=\"hr\" style=\"margin:0 0 var(--space-6)\">\n        <h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:36px;line-height:1.2;margin:0 0 var(--space-2)\">かかわってきたプロダクト<\u002Fh2>\n        <p style=\"font-size:15px;line-height:1.8;color:var(--color-neutral-700);margin:0 0 calc(var(--space-4) + var(--space-2));max-width:60ch\">地図の分析を、実際に使えるかたちに落とし込んだ仕事。企画書の作成から予算確保、要件定義、ベンダーマネジメントまで携わっています。<\u002Fp>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:baseline;margin-bottom:calc(var(--space-4) + var(--space-1))\">\n          <span class=\"tag tag-accent\" style=\"font-size:11px;letter-spacing:.1em\">2017–2025<\u002Fspan>\n          <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:22px;margin:0\">MS&amp;ADインターリスク総研時代<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:calc(var(--space-4) + var(--space-2)) var(--space-6)\">\n          <div>\n            <div class=\"plate\" style=\"margin:0 0 var(--space-3)\">\n              <div style=\"position:relative;width:100%;aspect-ratio:16/10\">\n                <image-slot id=\"product-shindo\" shape=\"rect\" placeholder=\"発災時拠点震度チェッカーの画面\" src=\"f2683209-66b1-456c-ad70-f15ca67655f5\"><\u002Fimage-slot>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"display:block;font-family:var(--font-heading);font-size:15px;color:var(--color-accent-700);font-feature-settings:'tnum';margin-bottom:4px\">2018<\u002Fspan>\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:21px;margin:0 0 6px\">発災時拠点震度チェッカー<\u002Fh3>\n            <p style=\"text-align:justify;font-size:13px;line-height:1.8;color:var(--color-neutral-700);margin:0\">地震発生時に拠点の震度を即時に把握するツール。要件定義から運用まで担当し、社内表彰を受けた。<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div class=\"plate\" style=\"margin:0 0 var(--space-3)\">\n              <div style=\"position:relative;width:100%;aspect-ratio:16/10\">\n                <image-slot id=\"product-suisearch\" shape=\"rect\" placeholder=\"スイサーチの画面\" src=\"6bbb55fb-ce8d-426c-9575-845f9dd71c3d\"><\u002Fimage-slot>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"display:block;font-family:var(--font-heading);font-size:15px;color:var(--color-accent-700);font-feature-settings:'tnum';margin-bottom:4px\">2019<\u002Fspan>\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:21px;margin:0 0 6px\">スイサーチ<\u002Fh3>\n            <p style=\"text-align:justify;font-size:13px;line-height:1.8;color:var(--color-neutral-700);margin:0\">気象庁の注意報を集約し、危険度を判定するツール。開発を起案し、MVP構築と予算獲得の交渉を行った。<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div class=\"plate\" style=\"margin:0 0 var(--space-3)\">\n              <div style=\"position:relative;width:100%;aspect-ratio:16/10\">\n                <image-slot id=\"product-flood\" shape=\"rect\" placeholder=\"洪水リスクファインダーの画面\" src=\"0fb0cc97-b7d1-46cb-857c-9cfe84f48c9d\"><\u002Fimage-slot>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"display:block;font-family:var(--font-heading);font-size:15px;color:var(--color-accent-700);font-feature-settings:'tnum';margin-bottom:4px\">2022–<\u002Fspan>\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:21px;margin:0 0 6px\">洪水リスクファインダー<\u002Fh3>\n            <p style=\"text-align:justify;font-size:13px;line-height:1.8;color:var(--color-neutral-700);margin:0\">気候変動の物理的リスクを扱うプラットフォーム。MVP構築、被害額計算ロジックの要件定義、販売戦略策定を主担当。社内表彰・グループ全社表彰（いずれも最優秀）。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:baseline;margin:calc(var(--space-8) + var(--space-2)) 0 calc(var(--space-4) + var(--space-1))\">\n          <span class=\"tag tag-accent\" style=\"font-size:11px;letter-spacing:.1em\">2025–<\u002Fspan>\n          <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:22px;margin:0\">日建設計総合研究所時代<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:calc(var(--space-4) + var(--space-2)) var(--space-6)\">\n          <div>\n            <div class=\"plate\" style=\"margin:0 0 var(--space-3)\">\n              <div style=\"position:relative;width:100%;aspect-ratio:16/10\">\n                <image-slot id=\"product-projectlinks\" shape=\"rect\" placeholder=\"Project Links の画面\" src=\"2ad531ae-d020-49bb-bc69-001516242507\"><\u002Fimage-slot>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:21px;margin:0 0 6px\">Project LINKS<\u002Fh3>\n            <p style=\"text-align:justify;font-size:13px;line-height:1.8;color:var(--color-neutral-700);margin:0 0 var(--space-3)\">国土交通省の分野横断的なDX推進プロジェクト。これまで活用されてこなかった行政情報を「データ」として再構築し、データに基づく政策立案（EBPM）や新たなビジネス創出につなげる取り組みで、プロジェクトパートナーとして参画している。<\u002Fp>\n            <a href=\"https://www.mlit.go.jp/links/\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px\">プロジェクトサイトを見る →<\u002Fa>\n          <\u002Fdiv>\n          <div>\n            <div class=\"plate\" style=\"margin:0 0 var(--space-3)\">\n              <div style=\"position:relative;width:100%;aspect-ratio:16/10\">\n                <image-slot id=\"product-quakesim\" shape=\"rect\" placeholder=\"地震動シミュレーションの画面\" src=\"37c9a041-556d-43a7-bb64-91dc1e22de08\"><\u002Fimage-slot>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:21px;margin:0 0 6px\">建物振動シミュレーションシステム<\u002Fh3>\n            <p style=\"text-align:justify;font-size:13px;line-height:1.8;color:var(--color-neutral-700);margin:0 0 var(--space-3)\">3D都市モデルとWebGISを使い、専門知識がなくても建物の振動シミュレーションを実行・可視化できるシステム。建物単位の倒壊リスクに加え、道路閉塞率や応急仮設住宅の必要戸数まで算出し、事前防災・事前復興の検討を支える。静岡市・戸田市で実証（PLATEAU uc25-02）。<\u002Fp>\n            <a href=\"https://www.mlit.go.jp/plateau/use-case/uc25-02/\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px\">ユースケースを見る →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width:900px;margin:0 auto;padding:var(--space-8) var(--space-6) calc(var(--space-8) + var(--space-6))\">\n      <button sc-camel-on-click=\"{{ goList }}\" class=\"btn btn-ghost\" style=\"font-size:13px;padding:6px 10px;margin-bottom:var(--space-6)\">← 事例一覧へ<\u002Fbutton>\n      <span class=\"tag tag-accent\" style=\"font-size:11px;letter-spacing:.1em\">{{ current.theme }}<\u002Fspan>\n      <h1 style=\"font-family:var(--font-heading);font-weight:400;font-size:44px;line-height:1.15;margin:var(--space-4) 0 var(--space-4)\">{{ current.title }}<\u002Fh1>\n      <p style=\"font-size:17px;line-height:1.8;color:var(--color-neutral-700);margin:0 0 var(--space-6);max-width:60ch;text-wrap:pretty\">{{ current.lead }}<\u002Fp>\n\n      <figure class=\"plate\" style=\"margin:0 0 calc(var(--space-6) + var(--space-2))\">\n        <div style=\"position:relative;width:100%;height:min(62vh,540px);background:var(--color-neutral-200)\">\n          <iframe src=\"{{ current.url }}\" title=\"{{ current.title }}\" loading=\"lazy\" style=\"width:100%;height:100%;border:0;display:block\"><\u002Fiframe>\n        <\u002Fdiv>\n        <figcaption style=\"display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4);padding-top:var(--space-3);flex-wrap:wrap\">\n          <span style=\"font-size:13px;line-height:1.6;color:var(--color-neutral-700)\">ドラッグで移動、スクロールで拡大縮小できます。<\u002Fspan>\n          <a href=\"{{ current.url }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;white-space:nowrap\">全画面で開く →<\u002Fa>\n        <\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-6);border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);padding:calc(var(--space-4) + var(--space-1)) 0;margin-bottom:calc(var(--space-6) + var(--space-2))\">\n        <div>\n          <p style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-600);margin:0 0 6px\">使用データ<\u002Fp>\n          <p style=\"font-size:14px;line-height:1.6;margin:0\">{{ current.data }}<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-600);margin:0 0 6px\">手法<\u002Fp>\n          <p style=\"font-size:14px;line-height:1.6;margin:0\">{{ current.method }}<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-600);margin:0 0 6px\">ソース<\u002Fp>\n          <p style=\"font-size:14px;line-height:1.6;margin:0\">{{ current.repo }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center\">\n        <a href=\"{{ current.url }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\" style=\"text-decoration:none\">マップを別タブで開く<\u002Fa>\n        <sc-if value=\"{{ hasArticle }}\" hint-placeholder-val=\"{{ false }}\">\n          <a href=\"{{ current.article }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-secondary\" style=\"text-decoration:none\">詳細記事を読む（note）<\u002Fa>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasRelated }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:calc(var(--space-8) + var(--space-6));border-top:1px solid var(--color-divider);padding-top:var(--space-6)\">\n        <p style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-600);margin:0 0 var(--space-4)\">関連する事例<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:calc(var(--space-4) + var(--space-1))\">\n          <sc-for list=\"{{ related }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ r.open }}\" style=\"text-align:left;background:none;border:0;border-top:1px solid var(--color-divider);padding:var(--space-3) 0 0;cursor:pointer;font-family:var(--font-body)\" style-hover=\"opacity:.65\">\n              <span style=\"display:block;font-size:11px;letter-spacing:.1em;color:var(--color-accent-700);margin-bottom:6px\">{{ r.theme }}<\u002Fspan>\n              <span style=\"display:block;font-family:var(--font-heading);font-size:18px;line-height:1.3;color:var(--color-text)\">{{ r.title }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width:1000px;margin:0 auto;padding:var(--space-8) var(--space-6) calc(var(--space-8) + var(--space-6))\">\n      <p style=\"font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-feature-settings:'tnum';color:var(--color-accent-700);margin:0 0 var(--space-3)\">GIS Fundamentals<\u002Fp>\n      <h1 style=\"font-family:var(--font-heading);font-weight:400;font-size:46px;line-height:1.15;margin:0 0 var(--space-4)\">GISの基礎と、<br>このサイトの手法<\u002Fh1>\n      <p style=\"text-align:justify;font-size:16px;line-height:1.9;color:var(--color-neutral-700);margin:0 0 calc(var(--space-8) + var(--space-2));text-wrap:pretty\">GIS（地理情報システム）は、位置情報をもつデータを蓄積・管理・分析・可視化するための仕組みです。地図と表（属性）を連動させて扱えることが最大の特徴で、ここで公開している地図もすべてその考え方の上に成り立っています。はじめにGISの基本的な要素を整理し、そのうえで各事例に共通する分析の流れを説明します。<\u002Fp>\n\n      <section style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-4);margin-bottom:calc(var(--space-8) + var(--space-2))\">\n        <div style=\"display:flex;gap:var(--space-4);align-items:baseline;margin-bottom:var(--space-6)\">\n          <span style=\"font-family:var(--font-heading);font-size:20px;color:var(--color-accent);font-feature-settings:'tnum'\">01<\u002Fspan>\n          <div>\n            <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:28px;margin:0 0 6px\">GISを成り立たせる5つの要素<\u002Fh2>\n            <p style=\"font-size:14px;line-height:1.7;color:var(--color-neutral-700);margin:0\">機器・ソフト・データ・人・手順がそろって、はじめて分析が回ります。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-4) calc(var(--space-4) + var(--space-1))\">\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">ハードウェア<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">PC・サーバ・GPS・センサなど、計測と処理の機器。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">ソフトウェア<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">QGIS・ArcGISなど。表示・編集・解析の機能を提供する。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">データ<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">位置と属性をもつ地理空間データ。もっとも重要な資産。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">人（運用）<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">分析と判断を担う人材、そしてそれを支える体制。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">手法・手順<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">分析のワークフローとルール。再現性を担保する。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-4);margin-bottom:calc(var(--space-8) + var(--space-2))\">\n        <div style=\"display:flex;gap:var(--space-4);align-items:baseline;margin-bottom:var(--space-6)\">\n          <span style=\"font-family:var(--font-heading);font-size:20px;color:var(--color-accent);font-feature-settings:'tnum'\">02<\u002Fspan>\n          <div>\n            <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:28px;margin:0 0 6px\">データモデル — ベクターとラスター<\u002Fh2>\n            <p style=\"font-size:14px;line-height:1.7;color:var(--color-neutral-700);margin:0\">地理空間データの表現は大きく二種類。対象の性質に応じて使い分けます。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:calc(var(--space-4) + var(--space-1))\">\n          <div class=\"card\" style=\"background:transparent;padding:calc(var(--space-4) + var(--space-1))\">\n            <span class=\"tag tag-outline\" style=\"font-size:11px;letter-spacing:.1em\">ベクター<\u002Fspan>\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:22px;margin:var(--space-3) 0 var(--space-2)\">点・線・面で地物を表現<\u002Fh3>\n            <p style=\"text-align:justify;font-size:14px;line-height:1.8;color:var(--color-neutral-700);margin:0 0 var(--space-3)\">ポイント／ライン／ポリゴン。座標の集合で表され、境界がはっきりした対象に向きます。<\u002Fp>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-600);margin:0;border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">例：建物・道路・河川・行政界・施設<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"background:transparent;padding:calc(var(--space-4) + var(--space-1))\">\n            <span class=\"tag tag-outline\" style=\"font-size:11px;letter-spacing:.1em\">ラスター<\u002Fspan>\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:22px;margin:var(--space-3) 0 var(--space-2)\">格子（セル）で現象を表現<\u002Fh3>\n            <p style=\"text-align:justify;font-size:14px;line-height:1.8;color:var(--color-neutral-700);margin:0 0 var(--space-3)\">セル（ピクセル）の集合。連続的に変化する現象に向き、解像度はセルサイズで決まります。<\u002Fp>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-600);margin:0;border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">例：標高（DEM）・気温・衛星画像・土地被覆<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-4);margin-bottom:calc(var(--space-8) + var(--space-2))\">\n        <div style=\"display:flex;gap:var(--space-4);align-items:baseline;margin-bottom:var(--space-6)\">\n          <span style=\"font-family:var(--font-heading);font-size:20px;color:var(--color-accent);font-feature-settings:'tnum'\">03<\u002Fspan>\n          <div>\n            <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:28px;margin:0 0 6px\">レイヤーと属性<\u002Fh2>\n            <p style=\"font-size:14px;line-height:1.7;color:var(--color-neutral-700);margin:0\">情報を層に分けて重ね、位置と表を結び付けて扱います。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:calc(var(--space-4) + var(--space-1))\">\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">主題ごとに層へ分ける<\u002Fh3>\n            <p style=\"text-align:justify;font-size:13px;line-height:1.8;color:var(--color-neutral-700);margin:0\">標高・河川・道路・建物・土地利用。テーマ別に管理し、必要な層だけを重ねます。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">重ね合わせが分析の基本<\u002Fh3>\n            <p style=\"text-align:justify;font-size:13px;line-height:1.8;color:var(--color-neutral-700);margin:0\">層のオーバーレイから「どこに何があるか」を導き出します。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">位置と属性は1対1<\u002Fh3>\n            <p style=\"text-align:justify;font-size:13px;line-height:1.8;color:var(--color-neutral-700);margin:0\">属性テーブルの行が地物、列が項目。地図上の選択が表に、表の抽出が地図に反映されます。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-4);margin-bottom:calc(var(--space-8) + var(--space-2))\">\n        <div style=\"display:flex;gap:var(--space-4);align-items:baseline;margin-bottom:var(--space-6)\">\n          <span style=\"font-family:var(--font-heading);font-size:20px;color:var(--color-accent);font-feature-settings:'tnum'\">04<\u002Fspan>\n          <div>\n            <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:28px;margin:0 0 6px\">座標系と投影法<\u002Fh2>\n            <p style=\"font-size:14px;line-height:1.7;color:var(--color-neutral-700);margin:0\">緯度経度で位置を示す地理座標系と、平面に投影して距離・面積を測れる投影座標系。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-raw-table class=\"table\" style=\"width:100%\">\n          <sc-raw-thead>\n            <sc-raw-tr><sc-raw-th style=\"text-align:left\">EPSG<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">座標系<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">主な用途<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-feature-settings:'tnum';white-space:nowrap\">EPSG:4326<\u002Fsc-raw-td><sc-raw-td>WGS84（緯度経度）<\u002Fsc-raw-td><sc-raw-td>GPS・世界共通<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-feature-settings:'tnum';white-space:nowrap\">EPSG:6668<\u002Fsc-raw-td><sc-raw-td>JGD2011（緯度経度）<\u002Fsc-raw-td><sc-raw-td>日本の測地系<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-feature-settings:'tnum';white-space:nowrap\">EPSG:3857<\u002Fsc-raw-td><sc-raw-td>Webメルカトル<\u002Fsc-raw-td><sc-raw-td>Web地図の表示<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-feature-settings:'tnum';white-space:nowrap\">EPSG:6677<\u002Fsc-raw-td><sc-raw-td>平面直角 IX系<\u002Fsc-raw-td><sc-raw-td>関東での距離・面積計測<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <p style=\"text-align:justify;font-size:13px;line-height:1.8;color:var(--color-neutral-700);margin:var(--space-4) 0 0;border-left:2px solid var(--color-accent);padding-left:var(--space-4)\">測地系や投影法が異なるデータを重ねると位置がずれます。読み込みのたびに座標系を確認し、統一してから解析にかけます。<\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-4);margin-bottom:calc(var(--space-8) + var(--space-2))\">\n        <div style=\"display:flex;gap:var(--space-4);align-items:baseline;margin-bottom:var(--space-6)\">\n          <span style=\"font-family:var(--font-heading);font-size:20px;color:var(--color-accent);font-feature-settings:'tnum'\">05<\u002Fspan>\n          <div>\n            <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:28px;margin:0 0 6px\">主な空間解析<\u002Fh2>\n            <p style=\"font-size:14px;line-height:1.7;color:var(--color-neutral-700);margin:0\">GISで「わかる」ことは、おおむねこれらの組み合わせから得られます。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-4) calc(var(--space-4) + var(--space-1))\">\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:18px;margin:0 0 6px\">バッファ<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">地物から一定距離の圏域を生成する（例：駅から500m）。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:18px;margin:0 0 6px\">オーバーレイ<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">複数のレイヤーを重ね、交差・結合・差分を求める。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:18px;margin:0 0 6px\">空間結合<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">位置関係にもとづき、別レイヤーの属性を付与する。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:18px;margin:0 0 6px\">近接・距離分析<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">最近隣・到達圏・経路など、距離にもとづく評価。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:18px;margin:0 0 6px\">ジオコーディング<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">住所や地名を座標に変換して地図化する。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:18px;margin:0 0 6px\">検索・抽出<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">空間条件と属性条件を組み合わせてデータを絞り込む。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-4);margin-bottom:calc(var(--space-8) + var(--space-2))\">\n        <div style=\"display:flex;gap:var(--space-4);align-items:baseline;margin-bottom:var(--space-6)\">\n          <span style=\"font-family:var(--font-heading);font-size:20px;color:var(--color-accent);font-feature-settings:'tnum'\">06<\u002Fspan>\n          <div>\n            <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:28px;margin:0 0 6px\">主なデータソース<\u002Fh2>\n            <p style=\"font-size:14px;line-height:1.7;color:var(--color-neutral-700);margin:0\">解析の質はデータで決まります。信頼できる公的データ・オープンデータが起点です。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-4) calc(var(--space-4) + var(--space-1))\">\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:18px;margin:0 0 6px\">基盤地図情報<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">国土地理院。道路・建物・標高など基盤となる地図データ。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:18px;margin:0 0 6px\">国土数値情報<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">国土交通省。土地利用・災害・施設など多分野の空間データ。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:18px;margin:0 0 6px\">e-Stat／統計GIS<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">国勢調査などの統計と、小地域の境界データ。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:18px;margin:0 0 6px\">OpenStreetMap<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">世界規模のオープン地図データ。道路やPOIなど。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:18px;margin:0 0 6px\">衛星・航空写真<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">土地被覆や変化検出の素材。ラスター解析の入口。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:18px;margin:0 0 6px\">標高データ（DEM）<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">傾斜・流域・浸水など、地形をもとにした分析に。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:38px;line-height:1.2;margin:0 0 var(--space-4)\">このサイトの分析の流れ<\u002Fh2>\n      <p style=\"text-align:justify;font-size:16px;line-height:1.9;color:var(--color-neutral-700);margin:0 0 var(--space-8);text-wrap:pretty\">ここまでの基礎をふまえ、公開している地図は次の三段階でつくっています。いずれも公開データを出発点に、オープンソースのGISツールで加工したものです。<\u002Fp>\n\n      <div style=\"display:grid;gap:calc(var(--space-6) + var(--space-2))\">\n        <section style=\"display:grid;grid-template-columns:60px minmax(0,1fr);gap:calc(var(--space-4) + var(--space-1));border-top:1px solid var(--color-divider);padding-top:calc(var(--space-4) + var(--space-1))\">\n          <span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent);font-feature-settings:'tnum'\">07<\u002Fspan>\n          <div>\n            <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:24px;margin:0 0 var(--space-3)\">地表を面としてとらえる<\u002Fh2>\n            <p style=\"text-align:justify;font-size:15px;line-height:1.85;color:var(--color-neutral-700);margin:0\">衛星画像による土地被覆データから、樹林・草地・水面といった要素を抽出します。年次のちがうデータを重ねることで、失われた面と残った面を分けて扱えるようにします。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"display:grid;grid-template-columns:60px minmax(0,1fr);gap:calc(var(--space-4) + var(--space-1));border-top:1px solid var(--color-divider);padding-top:calc(var(--space-4) + var(--space-1))\">\n          <span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent);font-feature-settings:'tnum'\">08<\u002Fspan>\n          <div>\n            <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:24px;margin:0 0 var(--space-3)\">つながりを測る<\u002Fh2>\n            <p style=\"text-align:justify;font-size:15px;line-height:1.85;color:var(--color-neutral-700);margin:0\">抽出した面に一定距離のバッファをかけ、重なり合うものをひとつのまとまりとして数えます。まとまりの大きさと、どこにも接続していない孤立した面の分布から、緑のネットワークの状態を評価します。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"display:grid;grid-template-columns:60px minmax(0,1fr);gap:calc(var(--space-4) + var(--space-1));border-top:1px solid var(--color-divider);padding-top:calc(var(--space-4) + var(--space-1))\">\n          <span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent);font-feature-settings:'tnum'\">09<\u002Fspan>\n          <div>\n            <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:24px;margin:0 0 var(--space-3)\">社会のデータと重ねる<\u002Fh2>\n            <p style=\"text-align:justify;font-size:15px;line-height:1.85;color:var(--color-neutral-700);margin:0\">地価、人口、災害リスク、開発の動きといった社会側のデータと重ね合わせ、緑地の価値や失われやすさを読み解きます。地図はWebGLベースのビューアで公開し、拡大縮小しながら確認できるようにしています。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:calc(var(--space-8) + var(--space-2));border-top:1px solid var(--color-divider);padding-top:calc(var(--space-4) + var(--space-1))\">\n        <p style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-600);margin:0 0 var(--space-3)\">ソースコード<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font-size:15px\">\n          <a href=\"https://github.com/shonadeshiko/greennetwork\" target=\"_blank\" rel=\"noopener\">github.com/shonadeshiko/greennetwork<\u002Fa>\n          <a href=\"https://github.com/shonadeshiko/treecovernetwork\" target=\"_blank\" rel=\"noopener\">github.com/shonadeshiko/treecovernetwork<\u002Fa>\n          <a href=\"https://github.com/shonadeshiko/pressdata\" target=\"_blank\" rel=\"noopener\">github.com/shonadeshiko/pressdata<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isProfile }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width:900px;margin:0 auto;padding:var(--space-8) var(--space-6) calc(var(--space-8) + var(--space-6))\">\n      <p style=\"font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-feature-settings:'tnum';color:var(--color-accent-700);margin:0 0 var(--space-3)\">Profile<\u002Fp>\n      <h1 style=\"font-family:var(--font-heading);font-weight:400;font-size:52px;line-height:1.1;margin:0 0 var(--space-4)\">伊藤 渚生<\u002Fh1>\n      <p style=\"font-size:15px;line-height:1.7;color:var(--color-neutral-700);margin:0 0 var(--space-6)\">日建設計総合研究所　／　前職：MS&amp;ADインターリスク総研<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:calc(var(--space-4) + var(--space-1));align-items:start;margin-bottom:calc(var(--space-8) + var(--space-2))\">\n        <div>\n          <p style=\"text-align:justify;font-size:16px;line-height:1.9;color:var(--color-neutral-700);margin:0 0 var(--space-4);text-wrap:pretty\">防災・気候変動・自然資本の分野で、企業や自治体に対するコンサルティングと、その裏側で動くデータ分析・Webプロダクトの構築を行ってきました。このサイトの地図は、そうした仕事や個人の研究のなかで手を動かしてきたものの記録です。<\u002Fp>\n          <p style=\"text-align:justify;font-size:16px;line-height:1.9;color:var(--color-neutral-700);margin:0;text-wrap:pretty\">興味を持ったらとりあえず突っ込んでいく——ランドスケープデザインを学びたいと思えば他大学に入り浸り、3Dプリンタが使えると聞けば勝手にモデルをつくる。そうやって拾ってきたものが、いつのまにか仕事の基盤になっています。<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"plate\" style=\"margin:0\">\n          <div style=\"position:relative;width:100%;aspect-ratio:4/5\">\n            <image-slot id=\"profile-portrait\" shape=\"rect\" placeholder=\"ポートレート写真\" src=\"b393b068-8160-45d5-b478-de9656c0ce8b\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <section style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-4);margin-bottom:calc(var(--space-8) + var(--space-2))\">\n        <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:28px;margin:0 0 var(--space-6)\">専門領域<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-6) calc(var(--space-4) + var(--space-2))\">\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">防災・BCP<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">地震・水災を対象とした事業継続計画の策定支援と訓練の設計。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">気候変動<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">TCFDに沿ったシナリオ分析と、物理的リスクの定量評価。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">自然資本<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">TNFD開示支援と、LEAPアプローチのための空間データ整備。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">GIS・プロダクト<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">分析結果をモックアップからWebプロダクトまで落とし込む。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-4);margin-bottom:calc(var(--space-8) + var(--space-2))\">\n        <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:28px;margin:0 0 var(--space-6)\">これまでの仕事<\u002Fh2>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:baseline;margin-bottom:var(--space-4)\">\n          <span class=\"tag tag-accent\" style=\"font-size:11px;letter-spacing:.1em\">2017–2025<\u002Fspan>\n          <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:22px;margin:0\">MS&amp;ADインターリスク総研<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:var(--space-6);margin-bottom:calc(var(--space-8) + var(--space-2))\">\n          <div style=\"display:grid;grid-template-columns:130px minmax(0,1fr);gap:calc(var(--space-4) + var(--space-1));border-top:1px solid var(--color-divider);padding-top:var(--space-4)\">\n            <span style=\"font-family:var(--font-heading);font-size:17px;color:var(--color-accent-700);font-feature-settings:'tnum'\">2017–2020<\u002Fspan>\n            <div>\n              <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:22px;margin:0 0 var(--space-2)\">BCPコンサルタント<\u002Fh3>\n              <p style=\"text-align:justify;font-size:14px;line-height:1.8;color:var(--color-neutral-700);margin:0\">地震・水災を対象に、大企業から中小企業までの事業継続計画の策定を支援。タイムラインに沿ったシナリオ訓練の設計・進行、講演、災害関連の調査研究を担当。発災時の震度を即時に把握するツールの開発も起案から運用まで手がけた。<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:130px minmax(0,1fr);gap:calc(var(--space-4) + var(--space-1));border-top:1px solid var(--color-divider);padding-top:var(--space-4)\">\n            <span style=\"font-family:var(--font-heading);font-size:17px;color:var(--color-accent-700);font-feature-settings:'tnum'\">2020–2025<\u002Fspan>\n            <div>\n              <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:22px;margin:0 0 var(--space-2)\">サステナビリティコンサルタント<\u002Fh3>\n              <p style=\"text-align:justify;font-size:14px;line-height:1.8;color:var(--color-neutral-700);margin:0\">自治体のSDGs推進支援を経て、気候変動シナリオ分析と物理的リスクの定量評価を主担当。海外ベンチャーとの協業による評価サービス、太陽光発電所を対象とした斜面崩壊リスク評価、TNFDに関する自然関連情報のGIS調査と開示支援を手がける。<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:130px minmax(0,1fr);gap:calc(var(--space-4) + var(--space-1));border-top:1px solid var(--color-divider);padding-top:var(--space-4)\">\n            <span style=\"font-family:var(--font-heading);font-size:17px;color:var(--color-accent-700);font-feature-settings:'tnum'\">2022–2025<\u002Fspan>\n            <div>\n              <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:22px;margin:0 0 var(--space-2)\">プロダクト開発<\u002Fh3>\n              <p style=\"text-align:justify;font-size:14px;line-height:1.8;color:var(--color-neutral-700);margin:0\">気候変動の物理的リスクを扱うプラットフォームの構築に、市場調査のためのMVP構築、被害額計算ロジックの要件定義、設計、販売戦略まで関わる。大学との共同研究の成果を実際のWebプロダクトとして公開した。<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:baseline;margin-bottom:var(--space-4)\">\n          <span class=\"tag tag-accent\" style=\"font-size:11px;letter-spacing:.1em\">2025–<\u002Fspan>\n          <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:22px;margin:0\">日建設計総合研究所<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:130px minmax(0,1fr);gap:calc(var(--space-4) + var(--space-1));border-top:1px solid var(--color-divider);padding-top:var(--space-4)\">\n          <span style=\"font-family:var(--font-heading);font-size:17px;color:var(--color-accent-700);font-feature-settings:'tnum'\">2025–<\u002Fspan>\n          <div>\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:22px;margin:0 0 var(--space-2)\">建設コンサルタント（デジタル・防災・自然）<\u002Fh3>\n            <p style=\"text-align:justify;font-size:14px;line-height:1.8;color:var(--color-neutral-700);margin:0\">都市や地域のプロジェクトに対し、デジタル・防災・自然の三つの視点から関わる。空間データの整備と解析を土台に、災害リスクや緑地・生態系の評価を行い、その結果を計画やまちづくりの判断材料として使える形に組み立てる。このサイトで公開している地図の多くは、この仕事のなかで手を動かしてきたものにあたる。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n\n      <section style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-4);margin-bottom:calc(var(--space-8) + var(--space-2))\">\n        <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:28px;margin:0 0 var(--space-2)\">スキルセット<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:var(--color-neutral-700);margin:0 0 var(--space-6)\">領域の知識と、それをかたちにする手段。この二つを行き来しています。<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:calc(var(--space-4) + var(--space-1))\">\n          <div class=\"card\" style=\"background:transparent;padding:calc(var(--space-4) + var(--space-1))\">\n            <span class=\"tag tag-outline\" style=\"font-size:11px;letter-spacing:.1em\">領域の知識<\u002Fspan>\n            <ul style=\"margin:var(--space-3) 0 0;padding:0;list-style:none;display:grid;gap:10px;font-size:14px;line-height:1.6;color:var(--color-neutral-700)\">\n              <li style=\"border-top:1px solid var(--color-divider);padding-top:10px\">企業へのコンサルティング経験<\u002Fli>\n              <li style=\"border-top:1px solid var(--color-divider);padding-top:10px\">学識経験者とのネットワーク<\u002Fli>\n              <li style=\"border-top:1px solid var(--color-divider);padding-top:10px\">防災対策・BCP<\u002Fli>\n              <li style=\"border-top:1px solid var(--color-divider);padding-top:10px\">気候変動<\u002Fli>\n              <li style=\"border-top:1px solid var(--color-divider);padding-top:10px\">自然資本<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"background:transparent;padding:calc(var(--space-4) + var(--space-1))\">\n            <span class=\"tag tag-outline\" style=\"font-size:11px;letter-spacing:.1em\">かたちにする手段<\u002Fspan>\n            <ul style=\"margin:var(--space-3) 0 0;padding:0;list-style:none;display:grid;gap:10px;font-size:14px;line-height:1.6;color:var(--color-neutral-700)\">\n              <li style=\"border-top:1px solid var(--color-divider);padding-top:10px\">モックアップ構築<\u002Fli>\n              <li style=\"border-top:1px solid var(--color-divider);padding-top:10px\">プロダクト構築<\u002Fli>\n              <li style=\"border-top:1px solid var(--color-divider);padding-top:10px\">GIS・リモートセンシング解析<\u002Fli>\n              <li style=\"border-top:1px solid var(--color-divider);padding-top:10px\">海外ベンチャーとのPoC対応<\u002Fli>\n              <li style=\"border-top:1px solid var(--color-divider);padding-top:10px\">リリース後の運用対応<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-4);margin-bottom:calc(var(--space-8) + var(--space-2))\">\n        <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:28px;margin:0 0 var(--space-6)\">研究・発表<\u002Fh2>\n        <sc-raw-table class=\"table\" style=\"width:100%\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-feature-settings:'tnum';white-space:nowrap;vertical-align:top\">2017<\u002Fsc-raw-td><sc-raw-td>生活学会 ポスター発表「尾根道利用による中山間集落へのアクセシビリティ」（徳島県神山町）<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-feature-settings:'tnum';white-space:nowrap;vertical-align:top\">2018<\u002Fsc-raw-td><sc-raw-td>造園学会 ランドスケープ研究（査読あり）「鎌倉市におけるネットワーク分析を用いた避難困難地域の推定」<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-feature-settings:'tnum';white-space:nowrap;vertical-align:top\">2019<\u002Fsc-raw-td><sc-raw-td>都市計画学会報告集「観光客の津波避難経路選択について」<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-feature-settings:'tnum';white-space:nowrap;vertical-align:top\">2020<\u002Fsc-raw-td><sc-raw-td>地理空間学会 ポスター発表「地域直売所の情報提供システムの構築」<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-feature-settings:'tnum';white-space:nowrap;vertical-align:top\">2023<\u002Fsc-raw-td><sc-raw-td>造園学会 ポスター発表「グリーンインフラに関する認識と議論の場の構築」<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-feature-settings:'tnum';white-space:nowrap;vertical-align:top\">2024<\u002Fsc-raw-td><sc-raw-td>生態学会 自由集会「若者は地域の自然環境保全の新たな担い手になり得るか」<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fsection>\n\n      <section style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-4)\">\n        <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:28px;margin:0 0 var(--space-6)\">活動<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-4) calc(var(--space-4) + var(--space-1))\">\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">グリーンインフラ官民連携プラットフォーム<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">分科会「若手の会」幹事（2021年〜）。産業展でのディスカッションのファシリテーションも担当。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">簡易版グリーンインフラマップ<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">国土交通省の要請を受けて構築（2022年）。産業展にて登壇。<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-3)\">\n            <h3 style=\"font-family:var(--font-heading);font-weight:500;font-size:19px;margin:0 0 6px\">地域での実践<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.7;color:var(--color-neutral-700);margin:0\">地元でのテイクアウト支援アプリの構築、田んぼでの活動やVR空間での再現など、仕事の外でも手を動かしている。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-4);margin-top:calc(var(--space-8) + var(--space-2))\">\n        <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:28px;margin:0 0 var(--space-6)\">記録<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:calc(var(--space-4) + var(--space-1))\">\n          <figure class=\"plate\" style=\"margin:0\">\n            <div style=\"position:relative;width:100%;aspect-ratio:4/3\">\n              <image-slot id=\"profile-photo-1\" shape=\"rect\" placeholder=\"産業展でのファシリテーション\" src=\"b393b068-8160-45d5-b478-de9656c0ce8b\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <figcaption style=\"font-size:12px;line-height:1.6;color:var(--color-neutral-600);padding-top:var(--space-3)\">グリーンインフラ産業展でのディスカッション（2022年）<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure class=\"plate\" style=\"margin:0\">\n            <div style=\"position:relative;width:100%;aspect-ratio:4/3\">\n              <image-slot id=\"profile-photo-2\" shape=\"rect\" placeholder=\"田んぼでの活動の写真\" src=\"0fe309a2-88a4-4c68-8eef-b00ec3e286a2\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <figcaption style=\"font-size:12px;line-height:1.6;color:var(--color-neutral-600);padding-top:var(--space-3)\">印西での田んぼの活動と、VR空間での再現<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure class=\"plate\" style=\"margin:0\">\n            <div style=\"position:relative;width:100%;aspect-ratio:4/3\">\n              <image-slot id=\"profile-photo-3\" shape=\"rect\" placeholder=\"出張先での写真\" src=\"e93b7fb3-3853-4d84-8adc-93a3392fb02b\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <figcaption style=\"font-size:12px;line-height:1.6;color:var(--color-neutral-600);padding-top:var(--space-3)\">ベンチャー発掘のためのシリコンバレー出張<\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"border-top:1px solid var(--color-divider);margin-top:var(--space-8)\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:var(--space-6);display:flex;justify-content:space-between;gap:calc(var(--space-4) + var(--space-1));font-size:12px;color:var(--color-neutral-600);flex-wrap:wrap\">\n      <span>GIS Casebook<\u002Fspan>\n      <span>地図はいずれも別タブで開きます<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nconst GN = 'https://shonadeshiko.github.io/greennetwork/';\n\nconst CASES = [\n  { id:'treecover', theme:'森林', title:'森林ネットワークの経年変化',\n    lead:'2000年と2023年の樹木被覆を再構築し、23年間で森林のつながりがどう変わったかを差分で示した地図。',\n    data:'Global Forest Change（Tree cover loss / 2000年被覆）', method:'年次別の森林面の再構築 → 100mバッファによる連続性判定 → 差分算出', repo:'treecovernetwork',\n    url:'https://shonadeshiko.github.io/treecovernetwork/treecover.html' },\n  { id:'press', theme:'都市開発', title:'開発圧力の高まりの分析',\n    lead:'土地利用の変化や開発の兆候を集計し、どの地域で開発圧力が強まっているかを可視化した地図。',\n    data:'開発動向に関する公開データ', method:'地域単位の集計と圧力指標の作成', repo:'pressdata',\n    url:'https://shonadeshiko.github.io/pressdata500m/',\n    article:'https://note.com/vast_panda1187/n/na58147b74d42' },\n  { id:'greenprice', theme:'不動産価値', title:'緑地と地価の関係',\n    lead:'まとまった緑地の近さと地価の分布を重ね、緑がもつ経済的な価値を地図の上で確かめる。',\n    data:'地価公示・土地被覆データ', method:'緑地からの距離帯ごとの地価集計', repo:'greennetwork',\n    url: GN + 'greenprice.html',\n    article:'https://note.com/vast_panda1187/n/n1ad6a6751488' },\n  { id:'habitat', theme:'生態系', title:'InVESTによる生息地質の評価',\n    lead:'土地利用と人為的な影響源から、生きものにとっての生息地の質を面的に推定した地図。',\n    data:'土地被覆・脅威レイヤ', method:'InVEST Habitat Quality モデル', repo:'greennetwork',\n    url: GN + 'Invest_habitatmap.html' },\n  { id:'isolated', theme:'孤立可能性地域', title:'孤立地域の抽出',\n    lead:'災害時などに周囲から取り残される可能性のある地域を、まわりとのつながりから抜き出して示す。',\n    data:'土地利用・接続性の解析データ', method:'つながりの有無による孤立可能性の判定', repo:'greennetwork',\n    url: GN + 'isolatedarea.html' },\n  { id:'isolatedresult', theme:'孤立可能性地域', title:'孤立地域の判定結果',\n    lead:'複数の条件での判定をまとめ、孤立する可能性の高さを段階で表現した総合の地図。',\n    data:'土地利用・接続性の解析データ', method:'条件別の判定結果の統合', repo:'greennetwork',\n    url: GN + 'isolate_modi' },\n];\n\nconst THEMES = ['すべて', '森林', '孤立可能性地域', '不動産価値', '都市開発', '生態系'];\n\nclass Component extends DCLogic {\n  state = { view: 'profile', theme: 'すべて', currentId: null };\n\n  chip(active) {\n    return 'font-family:var(--font-body);font-size:13px;padding:5px 14px;border-radius:999px;cursor:pointer;'\n      + 'border:1px solid ' + (active ? 'var(--color-accent)' : 'var(--color-divider)') + ';'\n      + 'background:' + (active ? 'var(--color-accent-100)' : 'transparent') + ';'\n      + 'color:' + (active ? 'var(--color-accent-800)' : 'var(--color-neutral-700)') + ';';\n  }\n\n  decorate(c) {\n    return Object.assign({}, c, {\n      slot: 'thumb-' + c.id,\n      detailSlot: 'detail-' + c.id,\n      slotHint: c.title + ' のサムネイル',\n      open: () => { this.setState({ view: 'detail', currentId: c.id }); window.scrollTo(0, 0); }\n    });\n  }\n\n  renderVals() {\n    const { view, theme, currentId } = this.state;\n    const current = CASES.find(c => c.id === currentId) || CASES[0];\n    return {\n      isList: view === 'list',\n      isDetail: view === 'detail',\n      isAbout: view === 'about',\n      isProfile: view === 'profile',\n      goProfile: (e) => { if (e) e.preventDefault(); this.setState({ view: 'profile' }); window.scrollTo(0, 0); },\n      goList: (e) => { if (e) e.preventDefault(); this.setState({ view: 'list' }); window.scrollTo(0, 0); },\n      goAbout: (e) => { if (e) e.preventDefault(); this.setState({ view: 'about' }); window.scrollTo(0, 0); },\n      themes: THEMES.map(t => ({\n        label: t,\n        style: this.chip(t === theme),\n        select: () => this.setState({ theme: t })\n      })),\n      visible: CASES.filter(c => theme === 'すべて' || c.theme === theme).map(c => this.decorate(c)),\n      current: this.decorate(current),\n      hasArticle: !!current.article,\n      hasRelated: CASES.some(c => c.theme === current.theme && c.id !== current.id),\n      related: CASES.filter(c => c.theme === current.theme && c.id !== current.id).slice(0, 3).map(c => this.decorate(c))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
